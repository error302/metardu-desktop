[package]
name = "metardu-sidecar"
version = "0.1.0"
edition = "2021"
description = "Rust sidecar for MetaRDU Desktop v2.0 - handles heavy compute (TIN, point cloud, MAVLink, GDAL, ONNX)"
license = "MIT"
authors = ["error302"]
repository = "https://github.com/error302/metardu-desktop"
publish = false

[[bin]]
name = "metardu-sidecar"
path = "src/main.rs"

[dependencies]
# JSON protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime (for future MAVSDK, ODM, ONNX integration)
tokio = { version = "1", features = ["full"] }

# Native GDAL bindings use the vendored GDAL 0.19 source with the upstream 3.13 API patch.
# Unix generates bindings from installed headers. Windows uses the upstream 3.12
# prebuilt bindings with the OSGeo4W runtime to avoid the MSVC enum signedness mismatch.

# GeoJSON serialization (for contour output)
geojson = { version = "0.24", optional = true }

# Instrument connection — serial port + Bluetooth LE
# tokio-serial: async serial port I/O (total stations, GNSS receivers via USB-serial)
# btleplug: cross-platform Bluetooth Low Energy (modern GNSS receivers)
# lazy_static: thread-safe port registry for concurrent instrument connections
# uuid: unique IDs for instrument connections
tokio-serial = { version = "5.4", optional = true }
btleplug = { version = "0.11", optional = true }
lazy_static = "1.4"
uuid = { version = "1.8", features = ["v4"] }
url = "2.5"

gdal_platform = { package = "metardu-gdal-platform-shim", path = "vendor/gdal-platform-shim", optional = true }

[features]
default = ["gdal-bindings", "instrument"]
# Enable native GDAL Rust bindings (requires system libgdal)
gdal-bindings = ["dep:gdal_platform", "dep:geojson"]
# Shell-out fallback (uses gdal_contour CLI, no native bindings)
# Use this feature on platforms where native GDAL bindings are hard to build
shell-out = []
# Enable live instrument connection (serial + BLE + NTRIP)
instrument = ["dep:tokio-serial", "dep:btleplug"]

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
