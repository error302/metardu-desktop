[package]
name = "metardu-gdal-platform-shim"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[target.'cfg(not(windows))'.dependencies]
gdal_unix = { package = "gdal", path = "../gdal-0.19.0", features = ["bindgen"] }

[target.'cfg(windows)'.dependencies]
gdal_windows = { package = "gdal", version = "=0.19.0" }